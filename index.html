<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datum 3D — Sahne Görüntüleyici</title>

    <script src="https://cesium.com/downloads/cesiumjs/releases/1.124/Build/Cesium/Cesium.js"></script>
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.124/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;800&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg:#080c10; --panel:rgba(8,12,16,0.88); --border:rgba(255,255,255,0.07);
            --accent:#00e5b0; --accent2:#0099ff; --warn:#ff6b35; --text:#e8edf2; --muted:#6b7a8d;
        }
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
        html,body{width:100%;height:100%;background:var(--bg);color:var(--text);font-family:'JetBrains Mono',monospace;overflow:hidden;}
        #cesiumContainer{width:100%;height:100%;}
        #topBar{position:absolute;top:0;left:0;right:0;height:48px;background:var(--panel);border-bottom:1px solid var(--border);backdrop-filter:blur(16px);display:flex;align-items:center;padding:0 20px;gap:16px;z-index:1000;}
        .logo{font-family:'Syne',sans-serif;font-weight:800;font-size:17px;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
        .divider{width:1px;height:20px;background:var(--border);}
        .scene-name{font-size:12px;color:var(--muted);}
        #sidePanel{position:absolute;top:60px;left:12px;width:270px;background:var(--panel);border:1px solid var(--border);border-radius:10px;backdrop-filter:blur(20px);z-index:999;overflow:hidden;}
        .panel-section{padding:14px 16px;border-bottom:1px solid var(--border);}
        .panel-section:last-child{border-bottom:none;}
        .section-label{font-size:9px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:10px;}
        .status-row{display:flex;justify-content:space-between;gap:8px;margin-bottom:4px;}
        .status-key{color:var(--muted);font-size:11px;}
        .status-val{color:var(--accent);font-size:10px;text-align:right;}
        #loadBar{height:2px;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0%;transition:width .4s;border-radius:1px;margin-top:8px;}
        #coordBox{position:absolute;bottom:36px;right:12px;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:8px 14px;font-size:10px;color:var(--muted);backdrop-filter:blur(16px);z-index:999;line-height:1.8;}
        #coordBox span{color:var(--accent);}
        #loadingOverlay{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .6s;}
        .ld-logo{font-family:'Syne',sans-serif;font-weight:800;font-size:32px;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:24px;}
        .ld-spinner{width:40px;height:40px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:16px;}
        @keyframes spin{to{transform:rotate(360deg);}}
        .ld-text{font-size:12px;color:var(--muted);}
        .ld-err{font-size:11px;color:var(--warn);margin-top:12px;max-width:400px;text-align:center;}
    </style>
</head>
<body>

<div id="loadingOverlay">
    <div class="ld-logo">DATUM 3D</div>
    <div class="ld-spinner"></div>
    <div class="ld-text" id="loadingMsg">Sahne yükleniyor...</div>
    <div class="ld-err" id="loadingErr"></div>
</div>

<div id="cesiumContainer"></div>

<div id="topBar">
    <div class="logo">DATUM 3D</div>
    <div class="divider"></div>
    <div class="scene-name">3D Sahne Görüntüleyici</div>
</div>

<div id="sidePanel">
    <div class="panel-section">
        <div class="section-label">Durum</div>
        <div class="status-row">
            <span class="status-key">Tileset</span>
            <span class="status-val" id="tilesStatus">Yükleniyor...</span>
        </div>
        <div class="status-row">
            <span class="status-key">Model</span>
            <span class="status-val" id="modelCount">—</span>
        </div>
        <div id="loadBar"></div>
    </div>
    <div class="panel-section">
        <button onclick="flyToScene()" style="width:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border:none;border-radius:6px;padding:8px;font-family:'JetBrains Mono',monospace;font-size:11px;color:#000;cursor:pointer;font-weight:600;margin-bottom:6px;">▶ Sahneyi Göster</button>
        <button onclick="viewer.camera.flyHome(1.5)" style="width:100%;background:transparent;border:1px solid var(--border);border-radius:6px;padding:7px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);cursor:pointer;">↺ Kamerayı Sıfırla</button>
    </div>
</div>

<div id="coordBox">
    <div><span id="cLat">—</span> °N</div>
    <div><span id="cLon">—</span> °E</div>
    <div><span id="cAlt">—</span> m</div>
</div>

<script>
// ================================================================
// AYARLAR
// ================================================================
Cesium.Ion.defaultAccessToken = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiI4YjJkMWY0Yi1iYWY0LTQzN2YtYmRjNS1lMjI3YWNlNjg0YTIiLCJpZCI6NDAxMTY3LCJpYXQiOjE3NzMxMjQzNDN9.VCxXEJpbmru_EdzEKbyeHeyTrQ-6h-MSX_Cue5pOiI8";

// Tileset yolu — GLB'ler ile aynı klasörde
const TILESET_URL = "./tileset.json";
// ================================================================

let viewer, tileset;

async function init() {
    viewer = new Cesium.Viewer("cesiumContainer", {
        terrain: Cesium.Terrain.fromWorldTerrain(),
        animation: false, timeline: false,
        baseLayerPicker: true, geocoder: true,
        homeButton: false, sceneModePicker: true,
        navigationHelpButton: false, infoBox: false, selectionIndicator: false,
    });

    viewer.scene.globe.enableLighting = true;
    viewer.scene.globe.depthTestAgainstTerrain = false;

    // Koordinat takibi
    viewer.scene.canvas.addEventListener("mousemove", e => {
        const ray = viewer.camera.getPickRay(new Cesium.Cartesian2(e.offsetX, e.offsetY));
        if (!ray) return;
        const pos = viewer.scene.globe.pick(ray, viewer.scene);
        if (!pos) return;
        const c = Cesium.Cartographic.fromCartesian(pos);
        document.getElementById("cLat").textContent = Cesium.Math.toDegrees(c.latitude).toFixed(6);
        document.getElementById("cLon").textContent = Cesium.Math.toDegrees(c.longitude).toFixed(6);
        document.getElementById("cAlt").textContent = c.height.toFixed(1);
    });

    try {
        document.getElementById("loadingMsg").textContent = "tileset.json yükleniyor...";
        document.getElementById("loadBar").style.width = "30%";

        tileset = await Cesium.Cesium3DTileset.fromUrl(TILESET_URL, {
            maximumScreenSpaceError: 16,
        });

        viewer.scene.primitives.add(tileset);
        document.getElementById("loadBar").style.width = "80%";
        document.getElementById("loadingMsg").textContent = "Kamera konumlandırılıyor...";

        await viewer.zoomTo(tileset);

        // Bilgi güncelle
        const bs = tileset.boundingSphere;
        const c  = Cesium.Cartographic.fromCartesian(bs.center);
        const lat = Cesium.Math.toDegrees(c.latitude).toFixed(4);
        const lon = Cesium.Math.toDegrees(c.longitude).toFixed(4);

        document.getElementById("tilesStatus").textContent = "✓ Yüklendi";
        document.getElementById("tilesStatus").style.color = "var(--accent)";
        document.getElementById("modelCount").textContent = lat + "°N " + lon + "°E";
        document.getElementById("loadBar").style.width = "100%";

        // Overlay kaldır
        const ov = document.getElementById("loadingOverlay");
        ov.style.opacity = "0";
        setTimeout(() => ov.style.display = "none", 600);

    } catch(e) {
        document.getElementById("loadingMsg").textContent = "Yükleme hatası";
        document.getElementById("loadingErr").textContent = e.message;
        document.getElementById("tilesStatus").textContent = "✗ Hata";
        document.getElementById("tilesStatus").style.color = "var(--warn)";
        console.error(e);
    }
}

function flyToScene() {
    if (tileset) viewer.zoomTo(tileset);
}

init();
</script>
</body>
</html>
